include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'

  errors:
    # Generated files are excluded above, so an unused import is always ours.
    unused_import: error
    unused_local_variable: error
    # An un-awaited Future is how a wallet credit silently fails to complete.
    unawaited_futures: error

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters
