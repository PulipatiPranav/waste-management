name: Mobile release

# Builds signed Android (AAB) and iOS (IPA) artifacts on a `mobile-v*` tag, then holds at a
# MANUAL approval gate before promoting each to its store's INTERNAL testing track.
#
# Build == automatic; promotion == gated by the `play-internal` / `appstore-internal`
# GitHub Environments (set required reviewers on them). Nothing reaches a store without a
# human approving, and even then it lands on an internal track as a draft, never live.
#
# All signing material and store credentials come from repo secrets — see docs/runbook.md
# and the setup roadmap for the exact list.
on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL to bake into the build"
        required: true
        default: "https://api.example.com/api/v1"

env:
  FLUTTER_VERSION: "3.44.6"
  # dart-defines shared by both builds. SENTRY_DSN is safe to expose (ingest-only key).
  API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.MOBILE_API_BASE_URL }}

defaults:
  run:
    working-directory: apps/mobile

jobs:
  # ---------------------------------------------------------------------------
  android-build:
    name: Build Android AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Release signing. The keystore + key.properties are decoded from secrets; the
      # app's android/app/build.gradle.kts must read key.properties for the release
      # signingConfig (a one-time setup — see the roadmap).
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties

      - name: Build AAB
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_ENV=production \
            --dart-define=SENTRY_DSN="${{ secrets.MOBILE_SENTRY_DSN }}"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  # ---------------------------------------------------------------------------
  ios-build:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Import the distribution certificate + provisioning profile from secrets into a
      # temporary keychain, so `flutter build ipa` can sign.
      - name: Import code-signing assets
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_ENV=production \
            --dart-define=SENTRY_DSN="${{ secrets.MOBILE_SENTRY_DSN }}" \
            --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: apps/mobile/build/ios/ipa/*.ipa
          retention-days: 14

  # ---------------------------------------------------------------------------
  # MANUAL GATE: promote the AAB to Play internal. `environment: play-internal` pauses
  # the run until a required reviewer approves it in the GitHub UI.
  # ---------------------------------------------------------------------------
  promote-android:
    name: Promote → Play internal (manual approval)
    needs: android-build
    runs-on: ubuntu-latest
    environment: play-internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - run: gem install fastlane --no-document

      - name: Upload to Play internal track
        env:
          PLAY_STORE_JSON_KEY_PATH: ${{ github.workspace }}/play-key.json
          AAB_PATH: ${{ github.workspace }}/apps/mobile/build/app/outputs/bundle/release/app-release.aab
        run: |
          echo '${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}' > "$PLAY_STORE_JSON_KEY_PATH"
          fastlane android internal

  # ---------------------------------------------------------------------------
  promote-ios:
    name: Promote → TestFlight (manual approval)
    needs: ios-build
    runs-on: macos-14
    environment: appstore-internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-release-ipa
          path: apps/mobile/build/ios/ipa/

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IPA_PATH: ${{ github.workspace }}/apps/mobile/build/ios/ipa/cpe_mobile.ipa
        run: fastlane ios beta
