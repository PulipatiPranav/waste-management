apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cpe

resources:
  - ../../base

images:
  - name: ghcr.io/OWNER/cpe-api
    # Phase 15's deploy job patches this with the immutable image digest CI built.
    # A floating `latest` tag in production means you cannot say what is running.
    newTag: REPLACE_WITH_RELEASE_TAG

replicas:
  - name: cpe-api
    count: 3
