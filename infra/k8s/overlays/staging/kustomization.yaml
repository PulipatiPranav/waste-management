apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cpe

resources:
  - ../../base

images:
  - name: ghcr.io/OWNER/cpe-api
    newTag: staging

replicas:
  - name: cpe-api
    count: 1

patches:
  - target:
      kind: ConfigMap
      name: cpe-api-config
    patch: |-
      - op: replace
        path: /data/CORS_ORIGINS
        value: "https://admin.staging.example.com"
      - op: replace
        path: /data/LOG_LEVEL
        value: "debug"
