# SHAPE ONLY — this file documents which secret keys the API expects.
#
# Do NOT fill these in and commit. Base64 is an encoding, not encryption: a real
# value committed here is a leaked credential, and rotating a database password
# after the fact is a bad afternoon.
#
# Phase 15 replaces this with External Secrets Operator (or the cloud provider's
# secret manager) so the values never touch the repo at all.
#
# For a throwaway cluster, create it imperatively instead of committing it:
#
#   kubectl create secret generic cpe-api-secrets -n cpe \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=REDIS_PASSWORD='...' \
#     --from-literal=JWT_ACCESS_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=PAYMENT_WEBHOOK_SECRET='whsec_...'
#
# The env schema (apps/api/src/config/env.schema.ts) REFUSES to boot in production
# without a real JWT secret, a non-default webhook secret, and real providers — so an
# incomplete Secret fails fast at startup rather than shipping something insecure.

apiVersion: v1
kind: Secret
metadata:
  name: cpe-api-secrets
  namespace: cpe
type: Opaque
stringData:
  # Always required.
  DATABASE_URL: "REPLACE_ME" # postgresql://user:pass@host:5432/db?schema=public
  REDIS_PASSWORD: "REPLACE_ME"
  JWT_ACCESS_SECRET: "REPLACE_ME" # openssl rand -base64 48
  PAYMENT_WEBHOOK_SECRET: "REPLACE_ME" # from the payment gateway dashboard


  # Required once real providers are switched on (the schema enforces this in prod):
  # RAZORPAY_KEY_ID: "REPLACE_ME"
  # RAZORPAY_KEY_SECRET: "REPLACE_ME"
  # FCM_SERVICE_ACCOUNT_JSON: "REPLACE_ME"   # the whole service-account JSON, as a string
  # Optional observability:
  # SENTRY_DSN: "REPLACE_ME"
