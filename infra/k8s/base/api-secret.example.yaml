# SHAPE ONLY — this file documents which secret keys the API expects.
#
# Do NOT fill these in and commit. Base64 is an encoding, not encryption: a real
# value committed here is a leaked credential, and rotating a database password
# after the fact is a bad afternoon.
#
# Phase 15 replaces this with External Secrets Operator (or the cloud provider's
# secret manager) so the values never touch the repo at all.
#
# For a throwaway cluster, create it imperatively instead of committing it:
#
#   kubectl create secret generic cpe-api-secrets -n cpe \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=REDIS_PASSWORD='...'

apiVersion: v1
kind: Secret
metadata:
  name: cpe-api-secrets
  namespace: cpe
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"
