# SHAPE ONLY — how the API's Secret is sourced in a real cluster, without a value ever
# touching this repo. Requires the External Secrets Operator (external-secrets.io).
#
# The idea: the real secrets live in your cloud provider's secret manager (AWS Secrets
# Manager, GCP Secret Manager, Vault, ...). The operator reads them and MATERIALISES the
# `cpe-api-secrets` Secret that the Deployments consume. Rotating a value in the manager
# re-syncs it into the cluster; nobody edits a base64 blob, and nothing secret is committed.
#
# This file is NOT in the kustomization — install the operator, then apply a real version
# of this with your provider's config. It documents the target shape.
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: cpe-secret-store
  namespace: cpe
spec:
  provider:
    # EXAMPLE: AWS Secrets Manager. Swap `provider` for gcpsm / vault / azurekv as needed.
    aws:
      service: SecretsManager
      region: ap-south-1 # Mumbai — data residency for an India-facing product
      auth:
        jwt:
          serviceAccountRef:
            name: cpe-external-secrets # IRSA-annotated ServiceAccount, no static keys
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cpe-api-secrets
  namespace: cpe
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cpe-secret-store
    kind: SecretStore
  target:
    name: cpe-api-secrets # the K8s Secret the Deployments mount
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: cpe/prod/database-url
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: cpe/prod/redis-password
    - secretKey: JWT_ACCESS_SECRET
      remoteRef:
        key: cpe/prod/jwt-access-secret
    - secretKey: PAYMENT_WEBHOOK_SECRET
      remoteRef:
        key: cpe/prod/payment-webhook-secret
    - secretKey: RAZORPAY_KEY_ID
      remoteRef:
        key: cpe/prod/razorpay-key-id
    - secretKey: RAZORPAY_KEY_SECRET
      remoteRef:
        key: cpe/prod/razorpay-key-secret
    - secretKey: FCM_SERVICE_ACCOUNT_JSON
      remoteRef:
        key: cpe/prod/fcm-service-account-json
    - secretKey: SENTRY_DSN
      remoteRef:
        key: cpe/prod/sentry-dsn
