apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cpe

# api-secret.example.yaml is deliberately NOT listed: it documents the expected keys,
# it is not a manifest to apply.
resources:
  - namespace.yaml
  - api-config.yaml
  - api-deployment.yaml
  - api-service.yaml

# includeSelectors:false matters. A label folded into a Deployment's matchLabels
# becomes immutable — changing it later means deleting and recreating the Deployment.
# Descriptive labels belong on the pods, not in the selector.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: circular-paper-economy
