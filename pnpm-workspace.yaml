packages:
  - "apps/api"
  - "apps/admin"
  - "packages/*"

# pnpm blocks dependency lifecycle scripts by default (a supply-chain guard: a
# compromised transitive dep cannot run code at install time). Each package that
# genuinely needs its postinstall is allowed here, explicitly.
allowBuilds:
  # Downloads/relocates the Prisma query engine binary; the client is unusable without it.
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  # Native image-processing binary used by Next.js image optimisation.
  sharp: true
  # Native module resolver used by the ESLint toolchain.
  unrs-resolver: true
  # Native binding for the Argon2 password hash. Without its build step the module
  # cannot load at all.
  argon2: true
  # Anonymous analytics pinger. Nothing depends on it running.
  "@scarf/scarf": false
  # Optional native fast-path for msgpackr (socket.io's serialiser). It falls back to
  # a pure-JS implementation if unbuilt, so this is a performance choice, not a
  # correctness one — but the native path is what the library expects in production.
  msgpackr-extract: true
  # protobufjs' build only generates an optimised codec; unbuilt it falls back to reflection, and
  # our OTLP exporter uses JSON encoding anyway. No need to run its install script.
  protobufjs: false
  # @sentry/cli downloads a native binary used ONLY to upload source maps during a CI build (with
  # SENTRY_AUTH_TOKEN). Not needed for local installs or runtime; CI that uploads maps can flip this.
  "@sentry/cli": false
